name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history
          fetch-tags: true     # annotated tag objects (not just refs)

      - name: Fetch annotated tag object
        run: git fetch --force --tags origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm deps
        run: npm ci

      - name: Compute version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app (unsigned, .app only)
        run: npm run tauri build -- --bundles app

      - name: Package DMG via hdiutil
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d /tmp/copyosity-dmg.XXXXXX)"
          mkdir -p "$STAGE/Copyosity"
          cp -R src-tauri/target/release/bundle/macos/Copyosity.app "$STAGE/Copyosity/"
          ln -s /Applications "$STAGE/Copyosity/Applications"
          DMG_PATH="Copyosity_${{ steps.version.outputs.version }}_aarch64.dmg"
          hdiutil create \
            -volname "Copyosity" \
            -srcfolder "$STAGE/Copyosity" \
            -ov -format UDZO \
            "$DMG_PATH"
          ls -lh "$DMG_PATH"

      - name: Extract release notes from tag annotation
        id: notes
        run: |
          # Annotated tag message; empty for lightweight tags
          MSG=$(git for-each-ref "refs/tags/${{ steps.version.outputs.tag }}" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d')
          MSG="$(printf '%s' "$MSG" | sed -e 's/[[:space:]]*$//')"
          if [ -n "$MSG" ]; then
            printf '%s' "$MSG" > release-notes.md
            echo "annotated=true" >> $GITHUB_OUTPUT
          else
            echo "annotated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release (annotated tag)
        if: steps.notes.outputs.annotated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "Copyosity_${{ steps.version.outputs.version }}_aarch64.dmg" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Create release (auto-generated notes)
        if: steps.notes.outputs.annotated == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "Copyosity_${{ steps.version.outputs.version }}_aarch64.dmg" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
