<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copyosity</title>
    <style>
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;

        --text-xs: 11px;
        --text-sm: 12px;
        --text-md: 13px;
        --text-lg: 15px;
        --leading-tight: 1.35;
        --leading-body: 1.5;

        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --radius-xl: 12px;

        --control-sm: 26px;
        --control-md: 30px;

        --surface-1: rgba(255, 255, 255, 0.025);
        --surface-2: rgba(255, 255, 255, 0.05);
        --surface-3: rgba(255, 255, 255, 0.08);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-default: rgba(255, 255, 255, 0.10);
        --border-strong: rgba(255, 255, 255, 0.16);

        --fg-primary: #ecedf2;
        --fg-secondary: #b8bdcc;
        --fg-muted: #7d8395;
        --fg-disabled: #525663;

        --accent: #6b8dd6;
        --accent-hover: #7c9ddf;
        --accent-bg: rgba(107, 141, 214, 0.12);
        --accent-bg-strong: rgba(107, 141, 214, 0.20);
        --accent-border: rgba(107, 141, 214, 0.32);

        --success: #6ecf8a;
        --success-bg: rgba(110, 207, 138, 0.12);
        --warning: #d9a55a;
        --warning-bg: rgba(217, 165, 90, 0.14);
        --warning-border: rgba(217, 165, 90, 0.30);
        --danger: #d77a7a;
        --danger-bg: rgba(215, 122, 122, 0.10);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
